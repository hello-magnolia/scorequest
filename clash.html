<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Critter Clash Practice · ScoreQuest</title>
<meta name="description" content="Practice one SAT biome at a time while Pomelo and the biome's boss critter square off in a little battle screen." />
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/katex/katex.min.css?v=b20261026a" />
<link rel="stylesheet" href="css/clash.css?v=b20261026a" />
<style>
:root {
  --bg: #efe9da; --card: #fffdf7; --ink: #2b2118; --muted: #6f6252; --line: #d9cfba;
  /* calm feedback: sage for right, clay for wrong, butter for picked */
  --good: #4f7a55; --good-soft: #e7eee2; --good-line: #9bb79c;
  --warn: #9a6232; --warn-soft: #f5ebdf; --warn-line: #d2ad86;
  --pick: #f6efd6; --pick-line: #c9b27a;
  --ward: #a48fcb; --ward-low: #d2a96a; --hp: #8fb07c; --hp-low: #d2a96a; --frame: #2b2118;
  --shadow: 4px 4px 0 rgba(43, 33, 24, .13); --edge: 2px solid rgba(43, 33, 24, .78);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130f; --card: #211d18; --ink: #efe6d4; --muted: #a99a83; --line: #3a332a;
    --good: #9cc69f; --good-soft: #1f2b20; --good-line: #4f7a55;
    --warn: #e0b07e; --warn-soft: #2e241a; --warn-line: #7a5634;
    --pick: #2f2a1a; --pick-line: #7d6c3e; --frame: #0c0a08;
    --shadow: 4px 4px 0 rgba(0, 0, 0, .35); --edge: 2px solid rgba(239, 230, 212, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #16130f; --card: #211d18; --ink: #efe6d4; --muted: #a99a83; --line: #3a332a;
  --good: #9cc69f; --good-soft: #1f2b20; --good-line: #4f7a55;
  --warn: #e0b07e; --warn-soft: #2e241a; --warn-line: #7a5634;
  --pick: #2f2a1a; --pick-line: #7d6c3e; --frame: #0c0a08;
    --shadow: 4px 4px 0 rgba(0, 0, 0, .35); --edge: 2px solid rgba(239, 230, 212, .28);
}
body { --fig-ink: var(--ink); --fig-grid: var(--line); --fig-bg: var(--card); --fig-fill-1: #c4c4c4; --fig-fill-2: #5a5a5a; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); min-height: 100vh; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px dashed var(--muted); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 36px; border-bottom: var(--edge); background: var(--card); position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 0 rgba(43, 33, 24, .06); }
.top .home { color: var(--muted); text-decoration: none; font: 600 13px var(--pixel); }
.top .home:hover { color: var(--ink); }
.top h1 { font: 700 20px/1 var(--pixel); margin: 0 4px 0 0; letter-spacing: .3px; }
.top select { font: 600 14px var(--pixel); background: var(--bg); border: 2px solid var(--frame); padding: 4px 8px; max-width: 220px; }
.top .spacer { flex: 1; }
.done { display: flex; align-items: center; gap: 10px; min-width: 160px; flex: 1 1 260px; max-width: 520px; }
.done .track { flex: 1; height: 14px; border: var(--edge); background: var(--bg); position: relative; overflow: hidden; }
.done .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #8fb07c; box-shadow: inset 0 3px 0 rgba(255,255,255,.3); transition: width .4s steps(8); }
.done .pct { font: 700 14px var(--pixel); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.tbtn { font: 700 13px var(--pixel); background: var(--card); border: var(--edge); padding: 5px 10px; box-shadow: 2px 2px 0 rgba(43, 33, 24, .13); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.tbtn:active { transform: translate(1px, 1px); box-shadow: none; }

/* ---------- the trail: where you are, nothing else ---------- */
.trail { display: flex; align-items: center; padding: 30px 36px 12px; overflow-x: auto; position: relative; z-index: 1; }
.trail .node { position: relative; flex-shrink: 0; width: 16px; height: 16px; border: var(--edge); background: var(--card); display: grid; place-items: center; font: 700 10px/1 var(--pixel); padding: 0; }
.trail .node.won { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.trail .node.missed { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.trail .node.cur { outline: 2px solid var(--frame); outline-offset: 2px; }
.trail .seg { flex: 1 1 18px; min-width: 6px; height: 0; border-top: 3px dotted var(--line); }
.trail .here { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; pointer-events: none; }
.trail .lair { display: flex; align-items: center; flex-shrink: 0; padding-left: 6px; }
#ambient { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
svg.px { image-rendering: pixelated; shape-rendering: crispEdges; display: block; }

/* ---------- layout: battle + explanation on the left, reading card on the right ---------- */
.lay { padding: 4px 28px 40px 36px; display: grid; grid-template-columns: minmax(340px, 40%) 1fr; gap: 28px; align-items: start; position: relative; z-index: 1; }
.left { display: grid; gap: 16px; }

/* ---------- focus mode: the battle screen steps aside, two quiet bars remain ---------- */
body.focus .screen, body.focus .log { display: none; }
body.focus .mini { display: grid; }
body.focus .trail .here { display: none; }

@media (max-width: 860px) {
  .lay { grid-template-columns: 1fr; padding: 4px 16px 32px; }
  .top, .trail { padding-left: 16px; padding-right: 16px; }
  .left { order: 2; }
  .card { order: 1; padding: 20px; }
  .screen { max-width: 520px; width: 100%; margin: 0 auto; }
  .done { flex-basis: 100%; }
}
</style>
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="top">
  <a class="home" href="index.html#world">&larr; ScoreQuest</a>
  <h1>Critter Clash</h1>
  <select id="biome" aria-label="Biome"></select>
  <select id="fDiff" aria-label="Difficulty">
    <option value="">Any difficulty</option>
    <option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option>
  </select>
  <div class="done" title="Questions answered correctly in this biome"><span class="track"><span class="fill" id="doneFill"></span></span><span class="pct" id="donePct">0%</span></div>
  <span class="spacer"></span>
  <button class="tbtn" id="bFocus" type="button" aria-pressed="false" title="Hide the battle screen (F)">Focus</button>
  <button class="tbtn" id="bMotion" type="button" title="Battle animations. Also in Settings">Motion: full</button>
  <button class="tbtn" id="bReset" type="button" title="Clear this biome's answers and start the boss over">Start over</button>
</div>
<nav class="trail" id="trail" aria-label="Question trail"></nav>
<main class="lay">
  <div class="left">
    <div class="screen" id="screen">
      <canvas id="cx-cv" aria-hidden="true"></canvas>
      <div class="plate me"><div class="nm" id="me-name"><span>Pomelo</span></div>
        <div class="row"><span class="lbl hpl">HP</span><span class="bar hp" id="me-hp" role="img"></span></div></div>
      <div class="plate boss"><div class="nm"><span id="cx-boss"></span></div>
        <div class="row"><span class="lbl">WARD</span><span class="bar ward" id="cx-ward" role="img"></span></div></div>
    </div>
    <p class="log" id="cx-log" aria-live="polite"></p>
    <div class="mini" id="mini" aria-hidden="true">
      <div class="row"><span>Pomelo</span><span class="bar hp" id="mini-hp"></span></div>
      <div class="row"><span id="mini-boss"></span><span class="bar ward" id="mini-ward"></span></div>
    </div>
    <section class="whybox" id="whybox" aria-live="polite" hidden><h3>Explanation</h3><div id="why"></div></section>
  </div>
  <article class="card" id="read"><div class="empty">Loading the biome&hellip;</div></article>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/katex/katex.min.js?v=b20261026a"></script>
<script defer src="assets/katex/auto-render.min.js?v=b20261026a"></script>
<script defer src="js/config.js?v=b20261026a"></script>
<script defer src="js/auth.js?v=b20261026a"></script>
<script defer src="data/questions.js?v=b20261026a"></script>
<script defer src="js/figures.js?v=b20261026a"></script>
<script defer src="js/questions.js?v=b20261026a"></script>
<script defer src="js/qcard.js?v=b20261026a"></script>
<script defer src="js/clash-arena.js?v=b20261026a"></script>
<script defer src="js/clash-ambient.js?v=b20261026a"></script>
<script defer src="js/clash.js?v=b20261026a"></script>
</body>
</html>
